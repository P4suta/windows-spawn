name = "windows-spawn"
summary = "Windows process creation with explicit handle ownership, Jobs, and pseudoconsoles"
install = "cargo add windows-spawn"
usage_language = "rust"
usage = '''
use windows_spawn::Command;

fn main() -> Result<(), Box<dyn std::error::Error>> {
    let output = Command::new("cmd.exe")
        .args(["/D", "/C", "echo hello"])
        .output()?;
    assert!(output.status.success());
    Ok(())
}
'''
