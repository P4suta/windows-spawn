[[invariant]]
id = "INV-013"
target = "command line quoting length and mitigation field replacement are panic free and bounded"
enforcement = ["kani"]
artifacts = ["src/core_logic.rs", ".cargo/mutants.toml", ".github/workflows/ci.yml"]
trust_boundaries = ["rust-compiler", "standard-library"]

[[mutation_exemption]]
matcher = '^src/core_logic\.rs:[0-9]+:[0-9]+: replace proofs::quoting_length_is_bounded with \(\)$'
source = "src/core_logic.rs"
expression = "fn quoting_length_is_bounded()"
proof = "quoting_length_is_bounded"
invariant = "INV-013"

[[mutation_exemption]]
matcher = '^src/core_logic\.rs:[0-9]+:[0-9]+: replace proofs::two_bit_replacement_changes_only_its_field with \(\)$'
source = "src/core_logic.rs"
expression = "fn two_bit_replacement_changes_only_its_field()"
proof = "two_bit_replacement_changes_only_its_field"
invariant = "INV-013"

[[mutation_exemption]]
matcher = '^src/core_logic\.rs:[0-9]+:[0-9]+: replace << with >> in proofs::two_bit_replacement_changes_only_its_field$'
source = "src/core_logic.rs"
expression = "3_u64 << 36"
proof = "two_bit_replacement_changes_only_its_field"
invariant = "INV-013"

[[mutation_exemption]]
matcher = '^src/core_logic\.rs:[0-9]+:[0-9]+: replace proofs::one_bit_replacement_changes_only_its_field with \(\)$'
source = "src/core_logic.rs"
expression = "fn one_bit_replacement_changes_only_its_field()"
proof = "one_bit_replacement_changes_only_its_field"
invariant = "INV-013"

[[mutation_exemption]]
matcher = '^src/core_logic\.rs:[0-9]+:[0-9]+: replace << with >> in proofs::one_bit_replacement_changes_only_its_field$'
source = "src/core_logic.rs"
expression = "1_u64 << 2"
proof = "one_bit_replacement_changes_only_its_field"
invariant = "INV-013"

