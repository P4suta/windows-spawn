[package]
name = "windows-spawn-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(fuzzing)", "cfg(kani)"] }

[[bin]]
name = "command-line"
path = "fuzz_targets/command_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "environment-block"
path = "fuzz_targets/environment_block.rs"
test = false
doc = false
bench = false

# Its own workspace, so the crate's workspace, MSRV, and lints stay as they are.
[workspace]
