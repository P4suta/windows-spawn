[package]
name = "spawnkit"
# Scaffold: the API is sketched, nothing is implemented yet. The first release
# with working code will be 0.1.0 (see the roadmap in README.md).
version = "0.0.1"
authors = ["Yasunobu Sakashita"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Advanced Windows process creation: CreateProcessW with STARTUPINFOEX and PROC_THREAD_ATTRIBUTE_LIST, with attribute-value lifetimes enforced by the type system"
readme = "README.md"
keywords = ["windows", "process", "createprocess", "job-object", "spawn"]
categories = ["os::windows-apis", "api-bindings"]
# Publishing is disabled while this is a scaffold; flip it when 0.1.0 is real.
publish = false

[target.'cfg(windows)'.dependencies]
thiserror = "2"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Console",
]
