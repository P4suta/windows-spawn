[package]
name = "windows-spawn"
version = "0.1.1"
authors = ["Yasunobu Sakashita"]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Windows process creation with explicit handle, Job, mitigation, ConPTY, and child ownership"
documentation = "https://docs.rs/windows-spawn"
repository = "https://github.com/P4suta/windows-spawn"
readme = "README.md"
keywords = ["windows", "process", "createprocess", "job-object", "spawn"]
categories = ["os::windows-apis", "api-bindings"]
include = [
  "/src/**",
  "/tests/**",
  "/examples/**",
  "/docs/adr/**",
  "/docs/crate.md",
  "/README.md",
  "/CHANGELOG.md",
  "/REUSE.toml",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
  "/LICENSES/**",
]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]

[[test]]
name = "argv_roundtrip"
path = "tests/argv_roundtrip.rs"
harness = false

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
]

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "2"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
missing_copy_implementations = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
error_impl_error = "deny"
expect_used = "deny"
fallible_impl_from = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
panic = "deny"
shadow_unrelated = "deny"
str_to_string = "deny"
string_slice = "deny"
todo = "deny"
try_err = "deny"
unimplemented = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"
# Contradicts rustc's `unreachable_pub`, which this crate keeps: items of private modules stay `pub(crate)`.
redundant_pub_crate = "allow"

# Enforces CONTRIBUTING's rule that every `unsafe` block has a safety justification.
#
# `multiple_unsafe_ops_per_block` stays off: some blocks adopt two OS resources together (see `pipe`), and splitting them would let one leak.
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true
