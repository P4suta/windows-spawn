[graph]
all-features = true
targets = [
  "aarch64-pc-windows-msvc",
  "i686-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
ignore = []
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT"]
confidence-threshold = 1.0
exceptions = [{ name = "foldhash", version = "=0.2.0", allow = ["Zlib"] }]
include-build = true
include-dev = true
unused-allowed-license = "deny"

[licenses.private]
ignore = false

[bans]
highlight = "all"
multiple-versions = "deny"
multiple-versions-include-dev = true
skip = []
skip-tree = []
wildcards = "deny"
# ADR 0016: no erased errors, erased dispatch, runtime registration, or implicit global state.
deny = [
  { crate = "anyhow", reason = "erases error types" },
  { crate = "arc-swap", reason = "shares mutable global state" },
  { crate = "async-trait", reason = "erases futures behind trait objects" },
  { crate = "color-eyre", reason = "erases error types" },
  { crate = "dashmap", reason = "shares mutable state and orders by hash" },
  { crate = "downcast-rs", reason = "dispatches on runtime types" },
  { crate = "erased-serde", reason = "erases serialization behind trait objects" },
  { crate = "eyre", reason = "erases error types" },
  { crate = "inventory", reason = "registers items at run time" },
  { crate = "lazy_static", reason = "initializes global state implicitly" },
  { crate = "linkme", reason = "registers items at link time" },
  { crate = "once_cell", reason = "initializes global state implicitly" },
  { crate = "parking_lot", reason = "shares mutable state behind locks" },
  { crate = "serde_traitobject", reason = "serializes trait objects" },
  { crate = "typetag", reason = "registers trait-object types at run time" },
]

[sources]
allow-git = []
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
required-git-spec = "rev"
unknown-git = "deny"
unknown-registry = "deny"
unused-allowed-source = "deny"
