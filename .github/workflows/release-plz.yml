---

name: Release-plz

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release-plz release
    if: github.repository == 'P4suta/windows-spawn'
    runs-on: windows-2022
    timeout-minutes: 45
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.run.outputs.releases_created }}
      tag: ${{ steps.released.outputs.tag }}
      version: ${{ steps.released.outputs.version }}
    steps:
      - name: Mint the release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Select the crates.io credential
        id: auth-mode
        env:
          CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: cargo xtask crates-io-auth-mode --github-output
      - name: Authenticate with crates.io trusted publishing
        id: crates-auth
        if: steps.auth-mode.outputs.bootstrap == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Run release-plz
        id: run
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9
        with:
          command: release
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: >-
            ${{ steps.crates-auth.outputs.token
            || secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
      - name: Read the released tag and version
        id: released
        if: steps.run.outputs.releases_created == 'true'
        shell: bash
        env:
          RELEASES: ${{ steps.run.outputs.releases }}
        run: |
          set -euo pipefail
          jq -r '.[0] | "tag=\(.tag)", "version=\(.version)"' <<< "$RELEASES" >> "$GITHUB_OUTPUT"

  finalize:
    name: Attest and publish the release
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-finalize.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      version: ${{ needs.release.outputs.version }}

  release-pr:
    name: Release-plz PR
    needs: release
    if: always() && github.repository == 'P4suta/windows-spawn'
    runs-on: windows-2022
    timeout-minutes: 30
    environment:
      name: release
    permissions: {}
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Mint the release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf
        with:
          tool: cargo-semver-checks@0.45.0
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9
        with:
          command: release-pr
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
