# SPDX-License-Identifier: MIT OR Apache-2.0

# Proposes the next release as a draft pull request, and never publishes; release.yml does, from a signed tag.
#
#   * A GitHub App token, because a pull request opened with GITHUB_TOKEN starts no CI.
#   * `environment: release` holds the App's credentials, and deploys from main only.
#   * A Windows runner, because `semver_check` builds the crate, and its `cfg(windows)` dependencies do not build on Linux.
name: Release PR

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-plz-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Release-plz PR
    if: github.repository == 'P4suta/windows-spawn'
    runs-on: windows-2022
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      id-token: write
    steps:
      - name: Fetch automation credentials
        id: doppler_automation_0
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_AUTOMATION_IDENTITY_ID }}
          doppler-project: windows-spawn
          doppler-config: automation
          inject-env-vars: false
      - name: Reject missing or unresolved automation credentials
        if: >-
          ${{ steps.doppler_automation_0.outcome == 'success' && (
          steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID, '${') ||
          steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY == '' ||
          startsWith(steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY, '${')
          ) }}
        shell: bash
        run: exit 1

      - name: Mint the release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ steps.doppler_automation_0.outputs.GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable
      # Required by `semver_check = true` in release-plz.toml.
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf  # v2.85.5
        with:
          tool: cargo-semver-checks@0.45.0
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9  # v0.5.131
        with:
          command: release-pr
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
