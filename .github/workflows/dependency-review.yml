name: Dependency review

"on":
  pull_request:
    paths: ['**/Cargo.toml', '**/Cargo.lock', 'mise.toml', 'mise.lock', '.github/workflows/**', '.github/renovate.json']

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
