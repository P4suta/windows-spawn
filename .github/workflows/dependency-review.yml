name: Dependency review

"on":
  pull_request:
    paths: ['**/Cargo.toml', '**/Cargo.lock', 'mise.toml', 'mise.lock', '.github/workflows/**', '.github/renovate.json']

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1
        with:
          fail-on-severity: moderate
