name: Deep verification

"on":
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    name: Spawn cleanup stress / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            cases: "100000"
          - target: i686-pc-windows-msvc
            cases: "20000"
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      WINDOWS_SPAWN_STRESS_CASES: ${{ matrix.cases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f  # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: >-
          cargo test --locked --target ${{ matrix.target }} --test windows_spawn
          spawn_cleanup_stress -- --ignored --exact

  random:
    name: Random command lines and environments at fifty times their size
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      RUSTFLAGS: --cfg windows_spawn_vectors
      WINDOWS_SPAWN_RANDOM_SCALE: "50"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f  # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo test --locked --test argv_roundtrip --test command_line_parsers

  fuzz:
    name: Fuzz / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [command-line, environment-block]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f  # v1
        with:
          toolchain: nightly-2026-10-13
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8  # v2.87.28
        with:
          tool: cargo-fuzz@0.13.2
      - run: >-
          cargo +nightly-2026-10-13 fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu
          -- -max_total_time=18000 -max_len=16384
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
