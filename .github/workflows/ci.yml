name: CI

"on":
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_AUTO_INSTALL: "false"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.17
          cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: mise x -- uv run --no-project --with 'reuse[charset-normalizer]==6.2.0' just check

  windows-fast:
    name: Windows x64 compile and spawn smoke
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.17
          install_args: rust just
          cache: true
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: mise x -- just windows-smoke

  required:
    name: required
    if: always()
    needs: [quality, windows-fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.17
          install_args: jq
          cache: true
      - name: Require the ordinary checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          CONTRACT: |
            type == "object" and
            (keys | sort) == ["quality", "windows-fast"] and
            all(.[]; type == "object" and .result == "success")
        run: jq -e "$CONTRACT" <<< "$RESULTS"
