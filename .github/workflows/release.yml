name: Release

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed SemVer tag to release
        required: true
        type: string
      publish_crates_io:
        description: Publish the matching package to crates.io
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable
      - name: Verify existing tag, commit, and Cargo version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: cargo xtask verify-release-tag "$env:RELEASE_TAG"

  release:
    name: Approved release
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf  # v2.85.2
        with:
          tool: cargo-cyclonedx@0.5.9
      - run: python -m pip install "reuse[charset-normalizer]==6.2.0"
      - name: Build and verify release candidate
        id: candidate
        run: cargo xtask release-candidate --github-output

      - name: Attest SLSA v1 provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d  # v4
        with:
          subject-path: |
            target/release-candidate/*.crate
            target/release-candidate/*.cdx.json
            target/release-candidate/*.reuse.spdx
            target/release-candidate/SHA256SUMS

      - name: Attest CycloneDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d  # v4
        with:
          subject-path: target/release-candidate/*.crate
          sbom-path: ${{ steps.candidate.outputs.sbom }}

      - name: Create draft GitHub Release
        id: github-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask draft-release "$env:RELEASE_TAG" --github-output

      - name: Select crates.io authentication mode
        id: crates-mode
        if: ${{ inputs.publish_crates_io }}
        env:
          CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: cargo xtask crates-io-auth-mode --github-output

      - name: Authenticate with crates.io trusted publishing
        id: crates-auth
        if: ${{ inputs.publish_crates_io && steps.crates-mode.outputs.bootstrap == 'false' }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      - name: Bootstrap first crates.io publication
        if: ${{ inputs.publish_crates_io && steps.crates-mode.outputs.bootstrap == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: cargo publish --locked

      - name: Publish to crates.io with trusted publishing
        if: ${{ inputs.publish_crates_io && steps.crates-mode.outputs.bootstrap == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $env:RELEASE_TAG --draft=false
