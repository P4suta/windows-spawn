---
# SPDX-FileCopyrightText: 2026 Yasunobu Sakashita
#
# SPDX-License-Identifier: MIT OR Apache-2.0

# Publishes the version a maintainer's signed `vX.Y.Z` tag names.
#
#   * The tag rulesets let only the maintainer create a `v*` tag, and `resolve` refuses one that is not annotated and verified as signed.
#     This file runs as the tagged commit has it, so those checks are defence in depth; the creation rule and the approval are the gates.
#   * `publish` deploys to the `crates-io` environment, which waits for the maintainer's approval.
#     crates.io's trusted publisher admits only that environment of this workflow, so nothing else can mint a publish token.
#   * Windows runners, because `cargo publish` verifies by building, and the `cfg(windows)` dependencies do not build on Linux.
name: Release

"on":
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

env:
  RUSTUP_TOOLCHAIN: stable

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate the tag and resolve the release revision
    if: github.repository == 'P4suta/windows-spawn'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.17
          install_args: jq
          cache: false
      - name: Require an annotated tag whose signature GitHub verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          if [ "$(jq -r .object.type <<<"${ref}")" != tag ]; then
            echo "::error::${TAG} is a lightweight tag; a release tag is annotated and signed"
            exit 1
          fi
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r .object.sha <<<"${ref}")")"
          if [ "$(jq -r .verification.verified <<<"${tag}")" != true ]; then
            echo "::error::GitHub did not verify the signature on ${TAG}: $(jq -r .verification.reason <<<"${tag}")"
            exit 1
          fi
      - name: Verify the tag, its commit on main, and the Cargo version
        run: cargo xtask verify-release-tag "$env:GITHUB_REF_NAME"
      - name: Export the verified revision
        id: resolve
        shell: pwsh
        run: |
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -cnotmatch '\A[0-9a-f]{40}\z') {
            throw 'release revision must be a complete commit ID'
          }
          "revision=$revision" >> $env:GITHUB_OUTPUT

  qualify:
    name: Qualify the release revision
    if: always()
    needs: [quality, test, i686-smoke, arm64, verifier, api, proofs]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.quality.outputs.revision }}
          persist-credentials: false
      - name: Require the release revision
        env:
          EXPECTED_REVISION: ${{ needs.quality.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.17
          install_args: jq
          cache: false
      - name: Require complete release qualification
        env:
          RESULTS: ${{ toJSON(needs) }}
          RELEASE_REVISION: ${{ needs.quality.outputs.revision }}
          CONTRACT: |
            type == "object" and
            ($revision | test("\\A[0-9a-f]{40}\\z")) and
            (keys | sort) == (["quality", "test", "i686-smoke", "arm64", "verifier", "api", "proofs"] | sort) and
            .quality.outputs.revision == $revision and
            (.quality.outputs.proofs | fromjson) == ["kani", "lean", "verus", "tla", "quint", "alloy", "prolog"] and
            all(.[]; type == "object" and .result == "success")
        run: jq -e --arg revision "$RELEASE_REVISION" "$CONTRACT" <<< "$RESULTS"

  quality:
    name: Release repository checks
    needs: resolve
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      MISE_AUTO_INSTALL: "false"
      RUSTUP_TOOLCHAIN: "1.99.1"
    outputs:
      revision: ${{ steps.selection.outputs.revision }}
      proofs: ${{ steps.selection.outputs.proofs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - name: Require the release revision
        env:
          EXPECTED_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.17
          cache: false
      - name: Select release qualification
        id: selection
        env:
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          CONTRACT: |
            if ($revision | test("\\A[0-9a-f]{40}\\z")) and $event == "push" and ($ref | test("\\Arefs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+\\z")) then
              {proofs: ["kani", "lean", "verus", "tla", "quint", "alloy", "prolog"], revision: $revision}
            else
              error("invalid release revision or event")
            end
        run: |
          set -euo pipefail
          selected=$(jq -n -c -e --arg revision "$RELEASE_REVISION" --arg event "$EVENT_NAME" --arg ref "$EVENT_REF" "$CONTRACT")
          jq -r '"proofs=\(.proofs | tojson)\nrevision=\(.revision)"' <<< "$selected" >> "$GITHUB_OUTPUT"
      - run: mise x -- uv run --no-project --with 'reuse[charset-normalizer]==6.2.0' just check

  test:
    name: Release Windows / Rust ${{ matrix.rust }}
    needs: [resolve, quality]
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.99.1", "1.84.1"]
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - name: Require the release revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - run: rustup toolchain install "$env:RUSTUP_TOOLCHAIN" --profile minimal
      - if: matrix.rust != '1.84.1'
        run: rustup component add clippy --toolchain "$env:RUSTUP_TOOLCHAIN"
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.17
          install_args: jq
          cache: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        if: matrix.rust != '1.84.1'
        with:
          version: v2026.10.17
          install_args: python uv
          cache: false
      - name: Lint the native Windows implementation
        if: matrix.rust != '1.84.1'
        run: cargo "+$env:RUSTUP_TOOLCHAIN" clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo "+$env:RUSTUP_TOOLCHAIN" xtask test
      - name: Check documentation and package contents
        if: matrix.rust != '1.84.1'
        run: |
          mise x -- cargo xtask doc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise x -- uv run --no-project --with 'reuse[charset-normalizer]==6.2.0' cargo xtask package-check

  i686-smoke:
    name: Release Windows i686 execution smoke
    needs: [resolve, quality]
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - name: Require the release revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - run: rustup toolchain install 1.99.1 --profile minimal --target i686-pc-windows-msvc
      - run: >-
          cargo +1.99.1 test --locked --target i686-pc-windows-msvc --test windows_spawn
          pseudoconsole_regular_stdio_stays_off_parent_pipes -- --exact

  arm64:
    name: Release Windows 11 ARM64
    needs: [resolve, quality]
    runs-on: windows-11-arm
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - name: Require the release revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.17
          install_args: jq
          cache: false
      - run: cargo +1.99.1 xtask test

  verifier:
    name: Release Application Verifier
    needs: [resolve, quality]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - name: Require the release revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 xtask verifier

  api:
    name: Release Windows public API
    needs: [resolve, quality]
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - name: Require the release revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde
        with:
          version: v2026.10.17
          install_args: rust just
          cache: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177  # v2.87.30
        with:
          tool: cargo-public-api@0.52.0
      - run: rustup toolchain install (Get-Content public-api/rust-toolchain -Raw).Trim() --profile minimal
      - run: mise x -- just public-api

  proofs:
    name: Release proofs / ${{ matrix.layer }}
    needs: [resolve, quality]
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.quality.outputs.proofs) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - name: Require the release revision
        env:
          EXPECTED_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install Kani 0.68.0
        if: matrix.layer == 'kani'
        run: |
          curl --fail --location --silent --show-error --output kani.tar.gz \
            https://github.com/model-checking/kani/releases/download/kani-0.68.0/kani-0.68.0-x86_64-unknown-linux-gnu.tar.gz
          echo "32e2b484d73ede0bbf64a2cf0879c4259422497d8aec4ee67d448de9ae7843d3  kani.tar.gz" | sha256sum --check
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup --use-local-bundle kani.tar.gz
      - name: Install elan 4.2.4
        if: matrix.layer == 'lean'
        run: |
          curl --fail --location --silent --show-error --output elan.tar.gz \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz" | sha256sum --check
          tar -xzf elan.tar.gz
          ./elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        if: matrix.layer == 'tla' || matrix.layer == 'quint' || matrix.layer == 'alloy'
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: matrix.layer == 'quint'
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install SWI-Prolog
        if: matrix.layer == 'prolog'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends swi-prolog-nox
      - env:
          LAYER: ${{ matrix.layer }}
        run: cargo +1.99.1 xtask proofs "$LAYER"

  candidate:
    name: Attest the qualified release candidate
    needs: [resolve, qualify]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      artifact-metadata: write  # Store the candidate's attestation metadata.
      attestations: write  # Attach provenance and SBOM attestations to the candidate.
      contents: read
      id-token: write  # Identify the workflow to the attestation service.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the qualified revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - run: rustup toolchain install stable --profile minimal
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177  # v2.87.30
        with:
          tool: cargo-cyclonedx@0.5.9
      - run: python -m pip install "reuse[charset-normalizer]==6.2.0"
      - name: Build and verify the release candidate
        id: candidate
        run: cargo xtask release-candidate --github-output
      - name: Attest SLSA v1 provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            target/release-candidate/*.crate
            target/release-candidate/*.cdx.json
            target/release-candidate/*.reuse.spdx
            target/release-candidate/SHA256SUMS
      - name: Attest CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: target/release-candidate/*.crate
          sbom-path: ${{ steps.candidate.outputs.sbom }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-candidate
          path: target/release-candidate/
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/windows-spawn
    permissions:
      contents: read
      id-token: write  # Authenticate this environment through crates.io trusted publishing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
      # The attestations cover the candidate, so the archive `cargo publish` uploads must be that very file.
      # `cargo package` is deterministic for a source tree; a mismatch stops the release before anything is published.
      - name: Require the archive to publish to be the attested candidate
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $name = "windows-spawn-$version.crate"
          cargo package --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo package exited $LASTEXITCODE" }
          $packaged = (Get-FileHash "target/package/$name" -Algorithm SHA256).Hash
          $candidate = (Get-FileHash "$env:RUNNER_TEMP/release-candidate/$name" -Algorithm SHA256).Hash
          if ($packaged -ne $candidate) {
            throw "packaged $name is $packaged, but the attested candidate is $candidate"
          }
          "packaged archive matches the attested candidate: $packaged" | Write-Output
      - name: Authenticate with crates.io trusted publishing
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6
      - name: Publish the crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - name: Require crates.io to serve the attested candidate
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $name = "windows-spawn-$version.crate"
          $candidate = (Get-FileHash "$env:RUNNER_TEMP/release-candidate/$name" -Algorithm SHA256).Hash
          $uri = "https://crates.io/api/v1/crates/windows-spawn/$version/download"
          $probe = Join-Path $env:RUNNER_TEMP 'published.crate'
          Invoke-WebRequest -Uri $uri -OutFile $probe -TimeoutSec 60 `
            -Headers @{ 'User-Agent' = 'windows-spawn-release' }
          $published = (Get-FileHash $probe -Algorithm SHA256).Hash
          if ($published -ne $candidate) {
            throw "crates.io serves $published, but the attested candidate is $candidate"
          }
          "crates.io serves the attested candidate: $published" | Write-Output

  github-release:
    name: Publish the GitHub release
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write  # Create the draft release and publish its complete asset set.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-candidate
          path: target/release-candidate
      # Assets go onto a draft first, because a published release cannot gain them without being seen half-built.
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask draft-release "$env:GITHUB_REF_NAME" --github-output
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest
