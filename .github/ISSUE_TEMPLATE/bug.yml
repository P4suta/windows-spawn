name: Bug report
description: Report reproducible incorrect behavior in windows-spawn
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the private security contact link instead.
  - type: input
    id: version
    attributes:
      label: Crate version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and architecture
      placeholder: Windows 11 24H2, x86_64
    validations:
      required: true
  - type: input
    id: rust
    attributes:
      label: Rust version
      placeholder: rustc 1.xx.x
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code and commands that reproduce the problem.
      render: rust
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Add sanitized error codes, logs, or other relevant context.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not disclose a suspected security vulnerability.
          required: true
