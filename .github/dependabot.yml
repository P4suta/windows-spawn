version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: deps
    # The Rust 1.75 checks cover xtask too, and sha2 0.11 requires Rust 1.85.
    # Lift this when the MSRV reaches 1.85; the checksum code handles both versions.
    ignore:
      - dependency-name: sha2
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      cargo-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
