[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
publish = false

[dependencies]
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
syn = { version = "2.0.119", features = ["full", "visit"] }
toml = "0.8.23"

[target.'cfg(windows)'.dependencies]
windows-spawn = { path = ".." }

[lints]
workspace = true
